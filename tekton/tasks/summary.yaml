---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: summary
spec:
  params:
    - name: request-file
      type: string
    - name: vm-ips
      type: string
  workspaces:
    - name: source
  steps:
    - name: summarize
      image: quay.io/openshift/origin-cli:latest
      script: |
        #!/bin/bash
        set -e
        curl -sL https://bootstrap.pypa.io/pip/3.9/get-pip.py -o /tmp/get-pip.py
        python3 /tmp/get-pip.py --target=/tmp/pylib -q
        PYTHONPATH=/tmp/pylib python3 -m pip install pyyaml --target=/tmp/pylib -q
        python3 /workspace/source/tekton/scripts/summary.py \
          /workspace/source/$(params.request-file) \
          '$(params.vm-ips)'
