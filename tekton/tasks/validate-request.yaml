---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: validate-request
spec:
  params:
    - name: request-file
      type: string
  workspaces:
    - name: source
  steps:
    - name: validate
      image: python:3.11-slim
      script: |
        #!/bin/bash
        pip install pyyaml -q
        python3 << 'PYEOF'
        import yaml
        import sys
        import re
        import os

        REQUEST_FILE = "/workspace/source/$(params.request-file)"

        LIMITS = {
            "max_cpu_cores": 2,
            "max_memory_gi": 4,
            "max_disk_gi":   15,
            "allowed_images": [
                "quay.io/containerdisks/fedora",
                "quay.io/containerdisks/centos-stream9",
                "quay.io/containerdisks/ubuntu",
            ],
            "allowed_storage_classes": [
                "gp3", "gp2", "gp3-csi", "gp2-csi", "efs-sc"
            ],
            "allowed_access_modes": [
                "ReadWriteOnce", "ReadWriteMany"
            ],
            "allowed_networks": ["pod"],
            "name_pattern": r"^[a-z0-9][a-z0-9-]{0,28}[a-z0-9]$",
        }

        def parse_memory(value):
            value = str(value)
            if value.endswith("Gi"):
                return float(value[:-2])
            elif value.endswith("Mi"):
                return float(value[:-2]) / 1024
            elif value.endswith("G"):
                return float(value[:-1])
            elif value.endswith("M"):
                return float(value[:-1]) / 1024
            else:
                return float(value)

        def parse_disk(value):
            value = str(value)
            if value.endswith("Gi"):
                return int(value[:-2])
            elif value.endswith("G"):
                return int(value[:-1])
            else:
                return int(value)

        print(f"Loading request file: {REQUEST_FILE}")
        if not os.path.exists(REQUEST_FILE):
            print(f"❌ VALIDATION FAILED: request file not found: {REQUEST_FILE}")
            sys.exit(1)

        with open(REQUEST_FILE) as f:
            request = yaml.safe_load(f)

        errors = []
        warnings = []

        meta = request.get("metadata", {})
        code = meta.get("code", "")
        if not code:
            errors.append("metadata.code is required")
        if not meta.get("requestedBy"):
            errors.append("metadata.requestedBy is required")
        if not meta.get("team"):
            errors.append("metadata.team is required")

        vms = request.get("vms", [])
        if not vms:
            errors.append("at least one VM must be specified")

        vm_names = []
        for i, vm in enumerate(vms):
            prefix = f"vms[{i}] ({vm.get('name', 'unnamed')})"

            name = vm.get("name", "")
            if not name:
                errors.append(f"{prefix}: name is required")
            elif not re.match(LIMITS["name_pattern"], name):
                errors.append(
                    f"{prefix}: name '{name}' must be lowercase "
                    f"alphanumeric and hyphens only, 2-30 chars"
                )
            elif name in vm_names:
                errors.append(f"{prefix}: duplicate VM name '{name}'")
            else:
                vm_names.append(name)

            os_spec = vm.get("os", {})
            image = os_spec.get("image", "")
            if not image:
                errors.append(f"{prefix}: os.image is required")
            elif not any(image.startswith(a) for a in LIMITS["allowed_images"]):
                errors.append(
                    f"{prefix}: os.image '{image}' is not allowed\n"
                    f"           allowed: {', '.join(LIMITS['allowed_images'])}"
                )
            if not os_spec.get("user"):
                errors.append(f"{prefix}: os.user is required")

            compute = vm.get("compute", {})
            cpu = compute.get("cpu")
            if cpu is None:
                errors.append(f"{prefix}: compute.cpu is required")
            elif not isinstance(cpu, int) or cpu < 1:
                errors.append(f"{prefix}: compute.cpu must be a positive integer")
            elif cpu > LIMITS["max_cpu_cores"]:
                errors.append(
                    f"{prefix}: compute.cpu {cpu} exceeds "
                    f"max allowed {LIMITS['max_cpu_cores']}"
                )

            memory = compute.get("memory")
            if memory is None:
                errors.append(f"{prefix}: compute.memory is required")
            else:
                try:
                    memory_gi = parse_memory(memory)
                    if memory_gi > LIMITS["max_memory_gi"]:
                        errors.append(
                            f"{prefix}: compute.memory {memory} exceeds "
                            f"max allowed {LIMITS['max_memory_gi']}Gi"
                        )
                except Exception:
                    errors.append(
                        f"{prefix}: compute.memory '{memory}' "
                        f"is invalid, use format: 1Gi, 512Mi"
                    )

            disk = vm.get("disk", {})
            size = disk.get("size")
            if size is None:
                errors.append(f"{prefix}: disk.size is required")
            else:
                try:
                    disk_gi = parse_disk(size)
                    if disk_gi > LIMITS["max_disk_gi"]:
                        errors.append(
                            f"{prefix}: disk.size {size} exceeds "
                            f"max allowed {LIMITS['max_disk_gi']}Gi"
                        )
                except Exception:
                    errors.append(
                        f"{prefix}: disk.size '{size}' "
                        f"is invalid, use format: 20Gi"
                    )

            sc = disk.get("storageClass", "")
            if not sc:
                errors.append(f"{prefix}: disk.storageClass is required")
            elif sc not in LIMITS["allowed_storage_classes"]:
                errors.append(
                    f"{prefix}: disk.storageClass '{sc}' is not allowed\n"
                    f"           allowed: {', '.join(LIMITS['allowed_storage_classes'])}"
                )

            access_mode = disk.get("accessMode", "")
            if not access_mode:
                errors.append(f"{prefix}: disk.accessMode is required")
            elif access_mode not in LIMITS["allowed_access_modes"]:
                errors.append(
                    f"{prefix}: disk.accessMode '{access_mode}' is not allowed\n"
                    f"           allowed: {', '.join(LIMITS['allowed_access_modes'])}"
                )

            network = vm.get("network", {})
            interfaces = network.get("interfaces", [])
            if not interfaces:
                errors.append(f"{prefix}: network.interfaces is required")
            for iface in interfaces:
                net = iface.get("network", "")
                if net not in LIMITS["allowed_networks"]:
                    errors.append(
                        f"{prefix}: network '{net}' is not allowed\n"
                        f"           allowed: {', '.join(LIMITS['allowed_networks'])}"
                    )

        print("")
        print("=" * 50)
        print(f"REQUEST: {code}")
        print("=" * 50)

        if warnings:
            print("\n⚠️  WARNINGS:")
            for w in warnings:
                print(f"   {w}")

        if errors:
            print("\n❌ VALIDATION FAILED:")
            for e in errors:
                print(f"   {e}")
            print("")
            print(f"Fix $(params.request-file) and push again.")
            print("=" * 50)
            sys.exit(1)

        print(f"\n✅ VALIDATION PASSED — {len(vms)} VM(s) ready to provision:")
        for vm in vms:
            compute = vm.get("compute", {})
            disk    = vm.get("disk", {})
            print(
                f"   {vm['name']:20} "
                f"cpu={compute.get('cpu')} "
                f"mem={compute.get('memory')} "
                f"disk={disk.get('size')} "
                f"os={vm['os']['image'].split('/')[-1]}"
            )
        print("=" * 50)
        PYEOF
